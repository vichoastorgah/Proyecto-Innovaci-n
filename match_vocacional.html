<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Vocacional — Prototipo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#f3f6fd;color:#1e2a4a}
.fade{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sel{background:linear-gradient(135deg,#2563eb,#4f8bff)!important;color:#fff!important;border-color:transparent!important;box-shadow:0 8px 20px -6px rgba(37,99,235,.55)}
.card{background:#fff;border-radius:1.25rem;box-shadow:0 6px 24px -10px rgba(30,60,140,.18)}
.bar{transition:height .7s cubic-bezier(.2,.8,.2,1),width .7s}
input[type=range]{accent-color:#2563eb}
.msg{animation:fade .25s ease}
</style>
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-blue-100 px-4 lg:px-8 h-16 flex items-center gap-4">
  <div class="flex items-center gap-2 font-extrabold text-lg text-blue-700"><span class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-sky-400 text-white grid place-items-center"><i class="fa-solid fa-compass"></i></span><span class="hidden sm:inline">Match Vocacional</span></div>
  <div class="flex-1 max-w-md mx-auto relative"><i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-sm"></i><input class="w-full bg-blue-50 rounded-full pl-10 pr-4 py-2.5 text-sm outline-none focus:ring-2 ring-blue-300 transition-all duration-300" placeholder="Buscar carreras, universidades…"></div>
  <button class="relative w-10 h-10 rounded-full hover:bg-blue-50 transition-all duration-300" onclick="toast('Tienes 3 notificaciones nuevas')"><i class="fa-regular fa-bell text-lg text-slate-600"></i><span class="absolute top-1.5 right-2 w-4 h-4 bg-rose-500 text-white text-[10px] rounded-full grid place-items-center">3</span></button>
  <div class="flex items-center gap-2"><div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-600 to-violet-500 text-white font-bold grid place-items-center">VP</div><div class="hidden md:block leading-tight"><div class="text-sm font-bold">Valentina Pérez</div><div class="text-xs text-slate-500">4° medio</div></div></div>
</header>
<div class="flex">
  <aside class="hidden lg:block w-64 shrink-0 p-6 sticky top-16 self-start h-[calc(100vh-4rem)]"><div class="card p-5"><div class="text-xs font-semibold text-slate-500 mb-4">Tu progreso</div><ol id="steps" class="space-y-1"></ol><div class="mt-5 h-2 rounded-full bg-blue-100 overflow-hidden"><div id="pbar" class="bar h-full bg-gradient-to-r from-blue-600 to-sky-400" style="width:20%"></div></div></div></aside>
  <main id="app" class="flex-1 min-w-0 p-4 lg:p-8 lg:pl-2"></main>
</div>

<div id="chat" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm grid place-items-center p-4">
  <div class="card w-full max-w-md overflow-hidden fade flex flex-col" style="height:min(34rem,90vh)">
    <div class="bg-gradient-to-r from-blue-700 to-blue-500 text-white p-4 flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-white/25 grid place-items-center font-bold" id="cAv">CR</div><div class="flex-1 leading-tight"><div class="font-bold" id="cName">Camila Rojas</div><div class="text-xs text-blue-100"><span class="inline-block w-2 h-2 rounded-full bg-emerald-300 mr-1"></span>En línea · Estudiante de Psicología</div></div><button onclick="closeChat()" class="w-8 h-8 rounded-full hover:bg-white/20 transition-all duration-300"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="msgs" class="flex-1 overflow-y-auto p-4 space-y-3 bg-blue-50/50"></div>
    <div class="p-3 flex gap-2 border-t border-blue-100"><input id="cIn" class="flex-1 bg-blue-50 rounded-full px-4 py-2.5 text-sm outline-none focus:ring-2 ring-blue-300" placeholder="Escribe tu mensaje…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()" class="w-11 h-11 rounded-full bg-blue-600 text-white hover:bg-blue-700 transition-all duration-300"><i class="fa-solid fa-paper-plane"></i></button></div>
  </div>
</div>
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-5 py-3 rounded-full shadow-xl opacity-0 pointer-events-none transition-all duration-300 z-50"></div>

<script>
const $=s=>document.querySelector(s);
const S={screen:1,step:1,intereses:new Set(['Ciencia y tecnología','Personas y sociedad']),asig:new Set(['Matemáticas','Biología']),futuro:'Tener un impacto en la sociedad',metas:'',curso:4,estilo:'En equipo',fort:{'Pensamiento lógico':75,'Creatividad':60,'Trabajo en equipo':85,'Comunicación':70},filtro:'Todas',tab:'Visión general',guardada:false,mentor:'Camila Rojas'};
const STEPS=['Perfil','Intereses','Historial','Metas','Resultado'];
const INT=[['Ciencia y tecnología','flask'],['Personas y sociedad','people-group'],['Arte y creatividad','palette'],['Negocios y emprendimiento','briefcase'],['Medio ambiente','leaf'],['Salud y bienestar','heart-pulse'],['Deportes','futbol'],['Comunicaciones','bullhorn']];
const ASIG=['Matemáticas','Lenguaje','Historia','Biología','Física','Química','Inglés','Artes','Educación Física'];
const FUT=['Tener un buen salario','Desarrollar ideas innovadoras','Trabajar en terreno','Tener un impacto en la sociedad','Equilibrar trabajo y vida personal'];
const NOTAS={Matemáticas:6.5,Lenguaje:5.8,Ciencias:6.2,Historia:5.0,Inglés:6.8,Artes:5.5};
const ESTILOS=[['Individual','user'],['En equipo','users'],['Ambos','user-group']];
const CAR=[
{n:'Ingeniería Civil Industrial',p:92,c:'Ciencias',i:'gears',a:['Gestión','Innovación','Análisis','Trabajo en equipo'],v:[90,85,94,88]},
{n:'Psicología',p:88,c:'Ciencias Sociales',i:'brain',a:['Personas','Bienestar','Comunicación','Análisis'],v:[95,90,82,84]},
{n:'Diseño',p:85,c:'Arte y Diseño',i:'pen-ruler',a:['Creatividad','Innovación','Comunicación','Estética'],v:[92,80,78,90]},
{n:'Medicina',p:80,c:'Salud',i:'stethoscope',a:['Salud','Servicio','Ciencias','Trabajo en equipo'],v:[88,86,84,70]},
{n:'Biotecnología',p:76,c:'Ciencias',i:'dna',a:['Investigación','Ciencias','Innovación','Análisis'],v:[80,85,72,78]}];
const FILT=[['Todas','Todas las recomendaciones (5)'],['Ciencias','Ciencias (2)'],['Ciencias Sociales','Ciencias Sociales (1)'],['Arte y Diseño','Arte y Diseño (1)'],['Salud','Salud (1)']];
const MENT=[['Camila Rojas','Estudiante de 4° año','CR','En línea'],['Matías Torres','Disponible hoy','MT','En línea'],['Valentina Meza','Egresada · Psicóloga clínica','VM','En línea']];
const UNIS=[['U. de Chile','UCH','bg-red-600'],['PUC','PUC','bg-blue-800'],['UDP','UDP','bg-amber-500'],['U. de Concepción','UdeC','bg-yellow-500'],['USACH','USA','bg-rose-700']];
const OPS=[['Javiera M.','Egresada U. de Chile',5,'Me encanta cómo la carrera te permite entender mejor a las personas y a ti misma. Exige harta lectura, pero vale cada minuto.'],['Tomás A.','Estudiante 3° año, PUC',4,'Las prácticas desde temprano me ayudaron a confirmar mi vocación. Ojo con la carga de trabajo en segundo año.'],['Francisca L.','Egresada UDP',5,'Hoy trabajo en una organización de salud mental y no cambiaría mi decisión.']];
const VID=[['¿Qué hace realmente un psicólogo?','8:24','from-blue-600 to-sky-400'],['Mi experiencia estudiando Psicología','12:05','from-violet-600 to-blue-400'],['Un día en la vida de un practicante','6:48','from-sky-600 to-teal-400']];
const REPL=['¡Hola Valentina! Qué bueno que escribas, cuéntame qué te gustaría saber 😊','Los primeros dos años son mucha teoría, pero desde 3° hay práctica y se disfruta más.','Si te gusta entender a las personas y no te asusta leer, vas por buen camino.','¡Claro! Podemos agendar una videollamada esta semana para conversar con calma.'];
let ri=0;

function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,2200)}
function steps(){$('#steps').innerHTML=STEPS.map((s,i)=>{const n=i+1,d=n<S.step,a=n===S.step;return `<li class="flex items-center gap-3 p-2.5 rounded-xl transition-all duration-300 ${a?'bg-blue-50':''}"><span class="w-8 h-8 rounded-full grid place-items-center text-sm font-bold transition-all duration-300 ${a?'bg-blue-600 text-white shadow-lg shadow-blue-300':d?'bg-emerald-500 text-white':'bg-slate-100 text-slate-400'}">${d?'<i class="fa-solid fa-check text-xs"></i>':n}</span><span class="text-sm ${a?'font-bold text-blue-700':'text-slate-500'}">${s}</span></li>`}).join('');$('#pbar').style.width=S.step*20+'%'}
function go(sc,step){const m=$('#app');m.style.opacity=0;m.style.transform='translateY(10px)';m.style.transition='all .25s';setTimeout(()=>{S.screen=sc;if(step)S.step=step;steps();render();window.scrollTo({top:0});m.style.opacity=1;m.style.transform='none'},250)}
function tog(set,v){S[set].has(v)?S[set].delete(v):S[set].add(v);render(true)}
function pick(k,v){S[k]=v;render(true)}
function notasHTML(){const off=(S.curso-4)*.25;return Object.entries(NOTAS).map(([k,v])=>{const x=Math.max(4,Math.min(7,+(v+(k.length%3-1)*off*-1+off*0).toFixed(1)));return `<div class="flex flex-col items-center gap-1 flex-1"><span class="text-xs font-bold text-blue-700">${x.toFixed(1)}</span><div class="w-full h-32 flex items-end"><div class="bar w-full rounded-t-lg bg-gradient-to-t from-blue-600 to-sky-300" style="height:${(x-1)/6*100}%"></div></div><span class="text-[11px] text-slate-500">${k}</span></div>`}).join('')}
function chip(on,txt,fn,ex=''){return `<button onclick="${fn}" class="px-4 py-2 rounded-full border border-blue-100 bg-white text-sm font-medium hover:border-blue-400 transition-all duration-300 ${on?'sel':''} ${ex}">${txt}</button>`}
function sec(t,b){return `<section class="card p-5 lg:p-6"><h3 class="font-bold mb-3">${t}</h3>${b}</section>`}

function s1(){return `<div class="fade max-w-4xl mx-auto"><div class="text-sm font-semibold text-blue-600 mb-1">Paso 1 de 5</div><h1 class="text-3xl lg:text-4xl font-extrabold tracking-tight">Tu perfil personal</h1><p class="text-slate-500 mt-2 mb-6 max-w-2xl">Empecemos por conocerte. Esta información nos ayudará a entender mejor quién eres y qué te motiva.</p><div class="space-y-5">
${sec('¿Cuáles son tus principales intereses?',`<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${INT.map(([t,i])=>`<button onclick="tog('intereses','${t}')" class="p-4 rounded-2xl border border-blue-100 bg-white text-sm font-semibold flex flex-col items-center gap-2 text-center hover:-translate-y-0.5 transition-all duration-300 ${S.intereses.has(t)?'sel':''}"><i class="fa-solid fa-${i} text-xl"></i>${t}</button>`).join('')}</div>`)}
${sec('Tus asignaturas favoritas',`<div class="flex flex-wrap gap-2">${ASIG.map(a=>chip(S.asig.has(a),a,`tog('asig','${a}')`)).join('')}</div>`)}
${sec('¿Qué esperas de tu futuro?',`<div class="grid sm:grid-cols-2 gap-2">${FUT.map(f=>`<button onclick="pick('futuro','${f}')" class="flex items-center gap-3 p-3 rounded-xl border border-blue-100 text-sm text-left hover:border-blue-400 transition-all duration-300 ${S.futuro===f?'sel':'bg-white'}"><span class="w-4 h-4 rounded-full border-2 ${S.futuro===f?'border-white bg-white/40':'border-blue-300'}"></span>${f}</button>`).join('')}</div>`)}
${sec('Tus metas personales',`<textarea oninput="S.metas=this.value" rows="3" class="w-full bg-blue-50 rounded-xl p-3 text-sm outline-none focus:ring-2 ring-blue-300 transition-all duration-300" placeholder="Ej.: Quiero ayudar a otras personas y estudiar en una universidad en Santiago…">${S.metas}</textarea>`)}
${sec('Tu historial de notas',`<div class="flex gap-2 mb-4 flex-wrap">${[1,2,3,4].map(c=>chip(S.curso===c,c+'° Medio',`pick('curso',${c})`)).join('')}</div><div class="flex gap-3 items-end">${notasHTML()}</div>`)}
${sec('¿Cuáles son tus mayores fortalezas?',`<div class="grid sm:grid-cols-2 gap-x-8 gap-y-4">${Object.entries(S.fort).map(([k,v])=>`<label class="block text-sm"><div class="flex justify-between font-medium mb-1"><span>${k}</span><span class="text-blue-600 font-bold" id="f_${k.length}">${v}%</span></div><input type="range" min="0" max="100" value="${v}" class="w-full" oninput="S.fort['${k}']=+this.value;$('#f_${k.length}').textContent=this.value+'%'"></label>`).join('')}</div>`)}
${sec('¿Qué estilo de trabajo prefieres?',`<div class="grid grid-cols-3 gap-3">${ESTILOS.map(([t,i])=>`<button onclick="pick('estilo','${t}')" class="p-5 rounded-2xl border border-blue-100 bg-white flex flex-col items-center gap-2 font-semibold text-sm hover:-translate-y-0.5 transition-all duration-300 ${S.estilo===t?'sel':''}"><i class="fa-solid fa-${i} text-2xl"></i>${t}</button>`).join('')}</div>`)}
</div><div class="flex justify-end mt-6"><button onclick="go(2,5)" class="px-7 py-3.5 rounded-full bg-gradient-to-r from-blue-700 to-blue-500 text-white font-bold shadow-lg shadow-blue-300 hover:scale-105 transition-all duration-300">Siguiente: Intereses ➔</button></div></div>`}

function radar(){const v=Object.values(S.fort),ax=Object.keys(S.fort),c=100,R=70,pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/2;return [c+Math.cos(a)*r,c+Math.sin(a)*r]};
const poly=r=>[0,1,2,3].map(i=>pt(i,r).join(',')).join(' ');
return `<svg viewBox="0 0 200 200" class="w-full max-w-[220px] mx-auto">${[.25,.5,.75,1].map(k=>`<polygon points="${poly(R*k)}" fill="none" stroke="#dbe5fb"/>`).join('')}${[0,1,2,3].map(i=>`<line x1="100" y1="100" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="#dbe5fb"/>`).join('')}<polygon points="${v.map((x,i)=>pt(i,R*x/100).join(',')).join(' ')}" fill="rgba(37,99,235,.25)" stroke="#2563eb" stroke-width="2"/>${ax.map((k,i)=>{const[p,q]=pt(i,R+16);return `<text x="${p}" y="${q+3}" font-size="7.5" text-anchor="middle" fill="#475569">${k.split(' ')[0]}</text>`}).join('')}</svg>`}

function s2(){const L=CAR.filter(c=>S.filtro==='Todas'||c.c===S.filtro);return `<div class="fade max-w-6xl mx-auto"><div class="text-sm font-semibold text-blue-600 mb-1">Paso 5 de 5</div><h1 class="text-3xl lg:text-4xl font-extrabold tracking-tight">Tus carreras recomendadas</h1><p class="text-slate-500 mt-2 mb-5 max-w-3xl">Basadas en tus intereses, habilidades y objetivos, hemos encontrado carreras que se ajustan a tu perfil y pueden ayudarte a construir el futuro que imaginas.</p>
<div class="flex flex-wrap gap-2 mb-5">${FILT.map(([k,t])=>chip(S.filtro===k,t,`pick('filtro','${k}')`)).join('')}</div>
<div class="grid xl:grid-cols-[1fr_300px] gap-6"><div><div class="grid md:grid-cols-2 gap-5">${L.map(c=>`<article class="card p-5 hover:-translate-y-1 transition-all duration-300"><div class="flex items-start justify-between gap-3"><div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-600 to-sky-400 text-white grid place-items-center text-xl"><i class="fa-solid fa-${c.i}"></i></div><div class="text-right"><div class="text-2xl font-extrabold text-blue-700">${c.p}%</div><div class="text-xs text-slate-500">de coincidencia</div></div></div><h3 class="font-bold text-lg mt-3">${c.n}</h3><div class="mt-3 space-y-2">${c.a.map((a,i)=>`<div class="flex items-center gap-2 text-xs"><span class="w-28 text-slate-600">${a}</span><div class="flex-1 h-2 rounded-full bg-blue-100 overflow-hidden"><div class="bar h-full rounded-full bg-gradient-to-r from-blue-600 to-sky-400" style="width:${c.v[i]}%"></div></div><span class="w-8 text-right font-semibold">${c.v[i]}%</span></div>`).join('')}</div><button onclick="${c.n==='Psicología'?"go(3)":"toast('Detalle completo disponible solo para Psicología en este prototipo')"}" class="mt-4 w-full py-2.5 rounded-full border-2 border-blue-600 text-blue-700 font-bold text-sm hover:bg-blue-600 hover:text-white transition-all duration-300">Ver detalle</button></article>`).join('')}</div>
<div class="mt-6 rounded-3xl bg-gradient-to-r from-blue-700 via-blue-600 to-sky-400 text-white p-6 flex items-center gap-5"><div class="text-5xl">🎉</div><div><div class="font-extrabold text-xl">¡Lo lograste!</div><p class="text-sm text-blue-50">Ahora tienes tus recomendaciones personalizadas. Explora cada carrera, habla con estudiantes y toma tu decisión con confianza.</p></div></div>
<button onclick="go(1,1)" class="mt-5 px-6 py-3 rounded-full bg-white border border-blue-200 text-blue-700 font-bold text-sm hover:bg-blue-50 transition-all duration-300"><i class="fa-solid fa-arrow-left mr-2"></i>Volver atrás</button></div>
<aside class="card p-5 self-start"><div class="flex items-center gap-3 mb-4"><div class="w-14 h-14 rounded-full bg-gradient-to-br from-blue-600 to-violet-500 text-white text-lg font-bold grid place-items-center">VP</div><div><div class="font-bold">Valentina Pérez</div><div class="text-xs text-slate-500">4° medio</div></div></div><div class="text-xs font-semibold text-slate-500 mb-2">Intereses</div><div class="flex flex-wrap gap-1.5 mb-4">${[...S.intereses].map(i=>`<span class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold">${i}</span>`).join('')||'<span class="text-xs text-slate-400">Sin selección</span>'}</div><div class="text-xs font-semibold text-slate-500 mb-1">Fortalezas</div>${radar()}</aside></div></div></div>`}

function s3(){const tabs=['Visión general','Malla y áreas','Opiniones','Mentores','Preguntas frecuentes'];
const body={'Visión general':`<p class="text-slate-600 leading-relaxed">La Psicología estudia la conducta y los procesos mentales. Podrás especializarte en áreas clínica, educacional, organizacional o social, con prácticas profesionales desde los primeros años.</p>`,'Malla y áreas':`<div class="grid sm:grid-cols-2 gap-2 text-sm">${['Años 1–2: Bases biológicas y teorías','Año 3: Metodología e investigación','Año 4: Prácticas y especialización','Año 5: Internado y tesis'].map(x=>`<div class="p-3 rounded-xl bg-blue-50">${x}</div>`).join('')}</div>`,'Mentores':`<p class="text-sm text-slate-600">Revisa el panel derecho para conversar con estudiantes y egresados.</p>`,'Preguntas frecuentes':`<div class="space-y-2 text-sm"><div class="p-3 rounded-xl bg-blue-50"><b>¿Se necesita buen puntaje en Matemáticas?</b><br>Se usa en estadística, pero el foco está en lectura y análisis.</div><div class="p-3 rounded-xl bg-blue-50"><b>¿Dónde puedo trabajar?</b><br>Salud, educación, organizaciones y práctica independiente.</div></div>`}[S.tab];
const star=n=>'<span class="text-amber-400 text-xs">'+'<i class="fa-solid fa-star"></i>'.repeat(n)+'<i class="fa-regular fa-star"></i>'.repeat(5-n)+'</span>';
const ops=`<div class="space-y-3">${OPS.map(o=>`<div class="p-4 rounded-2xl bg-blue-50/60"><div class="flex items-center gap-3 mb-1"><div class="w-9 h-9 rounded-full bg-blue-600 text-white text-xs font-bold grid place-items-center">${o[0][0]}</div><div class="leading-tight"><div class="text-sm font-bold">${o[0]}</div><div class="text-xs text-slate-500">${o[1]}</div></div><div class="ml-auto">${star(o[2])}</div></div><p class="text-sm text-slate-600">“${o[3]}”</p></div>`).join('')}</div>`;
return `<div class="fade max-w-6xl mx-auto"><button onclick="go(2)" class="text-sm font-semibold text-blue-700 hover:underline mb-4"><i class="fa-solid fa-arrow-left mr-1"></i>Volver a resultados</button>
<div class="card p-6 mb-6 flex flex-col lg:flex-row gap-5 lg:items-center"><div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-sky-400 text-white grid place-items-center text-3xl shrink-0"><i class="fa-solid fa-brain"></i></div><div class="flex-1"><h1 class="text-3xl font-extrabold tracking-tight">Psicología</h1><p class="text-slate-500">Comprende a las personas y contribuye a su bienestar</p></div><div class="flex flex-wrap gap-2"><button onclick="toast('Enlace copiado al portapapeles')" class="px-4 py-2.5 rounded-full border border-blue-200 text-sm font-semibold hover:bg-blue-50 transition-all duration-300"><i class="fa-solid fa-share-nodes mr-1"></i>Compartir</button><button onclick="S.guardada=!S.guardada;toast(S.guardada?'Carrera guardada':'Carrera quitada de guardados');render(true)" class="px-4 py-2.5 rounded-full border border-blue-200 text-sm font-semibold hover:bg-blue-50 transition-all duration-300"><i class="fa-${S.guardada?'solid':'regular'} fa-bookmark mr-1 text-blue-600"></i>${S.guardada?'Guardada':'Guardar carrera'}</button><button onclick="openChat('Camila Rojas','CR')" class="px-5 py-2.5 rounded-full bg-gradient-to-r from-blue-700 to-blue-500 text-white text-sm font-bold shadow-lg shadow-blue-300 hover:scale-105 transition-all duration-300"><i class="fa-regular fa-comments mr-1"></i>Hablar con un estudiante</button></div></div>
<div class="grid xl:grid-cols-[1fr_320px] gap-6"><div class="space-y-6">
<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${[['hourglass-half','Duración','5 años'],['briefcase','Empleabilidad','Alta (87%)'],['graduation-cap','Tipo de grado','Licenciatura'],['location-dot','Áreas de trabajo','Salud, educación, organizaciones y más']].map(d=>`<div class="card p-4"><i class="fa-solid fa-${d[0]} text-blue-600 mb-2"></i><div class="text-xs text-slate-500">${d[1]}</div><div class="text-sm font-bold">${d[2]}</div></div>`).join('')}</div>
<div class="card p-3"><div class="flex gap-1 overflow-x-auto mb-4">${tabs.map(t=>`<button onclick="pick('tab','${t}')" class="px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all duration-300 ${S.tab===t?'sel':'text-slate-500 hover:bg-blue-50'}">${t}</button>`).join('')}</div><div class="px-3 pb-3 fade">${S.tab==='Opiniones'?ops:body}</div></div>
${sec('Videos sobre la carrera',`<div class="grid sm:grid-cols-3 gap-4">${VID.map(v=>`<button onclick="toast('Reproduciendo: ${v[0].replace(/'/g,'')}')" class="text-left group"><div class="relative aspect-video rounded-2xl bg-gradient-to-br ${v[2]} grid place-items-center overflow-hidden"><span class="w-12 h-12 rounded-full bg-white/90 text-blue-700 grid place-items-center group-hover:scale-110 transition-all duration-300"><i class="fa-solid fa-play ml-0.5"></i></span><span class="absolute bottom-2 right-2 text-[11px] bg-black/60 text-white px-1.5 rounded">${v[1]}</span></div><div class="text-sm font-semibold mt-2">${v[0]}</div></button>`).join('')}</div>`)}
${S.tab!=='Opiniones'?sec('Opiniones de estudiantes y egresados',ops):''}</div>
<aside class="space-y-5 self-start">${sec('Universidades que la imparten',`<div class="space-y-2">${UNIS.map(u=>`<div class="flex items-center gap-3 p-2 rounded-xl hover:bg-blue-50 transition-all duration-300"><span class="w-10 h-10 rounded-xl ${u[2]} text-white text-xs font-bold grid place-items-center">${u[1]}</span><span class="text-sm font-semibold">${u[0]}</span></div>`).join('')}</div>`)}
${sec('Habla con estudiantes y egresados',`<div class="space-y-3">${MENT.map(m=>`<div class="flex items-center gap-3"><div class="relative"><div class="w-11 h-11 rounded-full bg-gradient-to-br from-blue-500 to-violet-500 text-white text-sm font-bold grid place-items-center">${m[2]}</div><span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full"></span></div><div class="flex-1 leading-tight"><div class="text-sm font-bold">${m[0]}</div><div class="text-xs text-slate-500">${m[1]}</div><div class="text-[11px] text-emerald-600 font-semibold">${m[3]}</div></div><button onclick="openChat('${m[0]}','${m[2]}')" class="px-3 py-1.5 rounded-full bg-blue-600 text-white text-xs font-bold hover:bg-blue-700 transition-all duration-300">Chatear</button></div>`).join('')}</div><button onclick="toast('Conversación agendada para mañana 17:00')" class="mt-4 w-full py-2.5 rounded-full border-2 border-blue-600 text-blue-700 text-sm font-bold hover:bg-blue-50 transition-all duration-300">Agendar conversación</button>`)}</aside></div></div>`}

function render(keep){const y=scrollY;$('#app').innerHTML=[null,s1,s2,s3][S.screen]();if(keep)scrollTo(0,y)}
function addMsg(t,me){const d=document.createElement('div');d.className='msg flex '+(me?'justify-end':'');d.innerHTML=`<div class="max-w-[80%] px-4 py-2.5 rounded-2xl text-sm ${me?'bg-blue-600 text-white rounded-br-sm':'bg-white shadow rounded-bl-sm'}">${t}</div>`;$('#msgs').appendChild(d);$('#msgs').scrollTop=1e5;return d}
function openChat(n,av){S.mentor=n;$('#cName').textContent=n;$('#cAv').textContent=av;$('#msgs').innerHTML='';$('#chat').classList.remove('hidden');ri=0;addMsg(`Hola, soy ${n.split(' ')[0]}. ¿En qué puedo ayudarte con Psicología?`,false);$('#cIn').focus()}
function closeChat(){$('#chat').classList.add('hidden')}
function send(){const i=$('#cIn'),t=i.value.trim().replace(/</g,'&lt;');if(!t)return;i.value='';addMsg(t,true);const ty=addMsg('<i class="fa-solid fa-ellipsis fa-beat"></i>',false);setTimeout(()=>{ty.remove();addMsg(REPL[ri++%REPL.length],false)},1100)}
$('#chat').addEventListener('click',e=>{if(e.target.id==='chat')closeChat()});
steps();render();
</script>
</body>
</html>
